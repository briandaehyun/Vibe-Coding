<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>나의 첫 바이브 코딩</title>
    <style>
        body { 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; margin: 0; transition: background-color 0.5s ease; font-family: sans-serif;
        }
        button { 
            padding: 15px 30px; font-size: 20px; font-weight: bold;
            border: none; border-radius: 10px; cursor: pointer;
            background-color: #007ACC; color: white;
        }
        button:hover { background-color: #005A9E; }
    </style>
</head>
<body>
    <h1>VS Code 실습 완료 🚀</h1>
    <button onclick="changeColor()">배경색 바꾸기</button>

    <script>
        function changeColor() {
            const colors = ['#FFDDC1', '#FFABAB', '#FFC3A0', '#D5AAFF', '#85E3FF', '#B9FFB0'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            document.body.style.backgroundColor = randomColor;
        }
    </script>
</body>
</html>
